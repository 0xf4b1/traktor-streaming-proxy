# don't change
beatport.accountId=1337338

# the beatport license type
# default: macos
# available: macos, windows
beatport.license=windows

# whether to use the keystore.jks located at certs/keystore.jks
# if set to 'false', a self-signed certificate will be generated at runtime
# default: false
server.useKeystore=true

# comma-separated list of enabled sources
# available: spotify,tidal,youtube
sources.enabled=youtube,soundcloud

youtube.oauth.file=/run/secrets/youtube-oauth.properties
soundcloud.oauth.file=/run/secrets/soundcloud-oauth.properties
# SoundCloud-Audio
soundcloud.audioQuality=best
soundcloud.preferRemux=true
soundcloud.transcodeBitrate=256k
# only enabled sources can be enabled for search
# leave empty if you want to use all
search.enabled=

# comma-separated public YouTube playlist IDs or full playlist URLs
# playlist titles and tracks are loaded through NewPipe
# example: youtube.playlists=PLabc123,https://www.youtube.com/playlist?list=PLdef456
# example: soundcloud.playlists=https://soundcloud.com/passo12/sets/bochka-dark-techno,...
youtube.playlists=https://www.youtube.com/playlist?list=PLob-b6GKkq-gPA5XurGXXSf7Afvbqqwck,https://www.youtube.com/playlist?list=PL0aetYjgHSby3sQocQDQmWMAdx7LWei4G,https://www.youtube.com/playlist?list=PL0aetYjgHSbz4hqcZEcneO2PUi5VGLxKO
soundcloud.playlists=https://soundcloud.com/passo12/sets/bochka-dark-techno
# if you enable tidal, you need to fill in your client id
# you need your account credentials when asked to visit the authentication web page
tidal.clientId=YOUR-CLIENT-ID
tidal.clientSecret=YOUR-CLIENT-SECRET
